<!doctype html><html><head><meta charset="utf-8"><style>
:root{--main:#1F3864;--tint:#EEF2F8;--light:#DCE3EE;--mid:#8EA3C4;--gray:#6B6B6B;--dark:#222;--red:#C00000}
body{margin:0;font-family:"Malgun Gothic","Noto Sans CJK KR",sans-serif;word-break:keep-all}
#figure{width:658px;height:346px;display:grid;grid-template-columns:250px 1fr;gap:14px;box-sizing:border-box}
.p{position:relative;border:1px solid var(--light);border-radius:8px;background:#F7F9FC;overflow:hidden}
.h{position:absolute;left:10px;top:6px;font-size:14px;font-weight:700;color:var(--main);z-index:2}
svg{position:absolute;left:0;top:0}
</style><script src="mapdata.js"></script></head><body><div id="figure">
<div class="p"><div class="h">전국</div><svg id="kr" width="250" height="346"></svg></div>
<div class="p"><div class="h">서울 6곳</div><svg id="se" width="394" height="346"></svg></div>
</div><script>
const NS="http://www.w3.org/2000/svg";function el(p,t,a,txt){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt)e.textContent=txt;p.appendChild(e);return e}
function proj(lon0,lon1,lat1,W,H,pad,top){const c=Math.cos(36.5*Math.PI/180);return(lo,la)=>[pad+(lo-lon0)*c*s(),top+(lat1-la)*s()];function s(){return 0}}
function mk(lon0,lon1,lat0,lat1,W,H,padX,padT,padB){const c=Math.cos((lat0+lat1)/2*Math.PI/180);const sc=Math.min((W-2*padX)/((lon1-lon0)*c),(H-padT-padB)/(lat1-lat0));
 const ox=padX+((W-2*padX)-(lon1-lon0)*c*sc)/2;return(lo,la)=>[ox+(lo-lon0)*c*sc,padT+(lat1-la)*sc]}
const path=(P,rings)=>rings.map(r=>'M'+r.map(c=>P(c[0],c[1]).map(v=>v.toFixed(1)).join(',')).join('L')+'Z').join('');
// 전국
const kr=document.getElementById('kr');const P=mk(125.9,129.7,33.0,38.75,250,346,8,28,6);
KOREA.forEach(f=>f.g.forEach(poly=>el(kr,'path',{d:path(P,poly),fill:f.id==='410'?'#DCE3EE':'#ECEFF3',stroke:f.id==='410'?'#8EA3C4':'#D5D9DF','stroke-width':f.id==='410'?1:0.6})));
const [bx0,by0]=P(126.85,37.70),[bx1,by1]=P(127.20,37.44);el(kr,'rect',{x:bx0,y:by0,width:bx1-bx0,height:by1-by0,fill:'none',stroke:'#C00000','stroke-width':1.2,'stroke-dasharray':'3,2'});
const nat=[{n:'서울 6곳',lo:127.0,la:37.56,c:'#C00000',r:7,dx:14,dy:10},{n:'부평 북새통',lo:126.721,la:37.508,c:'#1F3864',r:5,dx:-4,dy:24,a:'start'},{n:'포천 태영분식',lo:127.200,la:37.894,c:'#1F3864',r:5,dx:10,dy:-6},{n:'대구 동성로떡볶이',lo:128.596,la:35.869,c:'#1F3864',r:5,dx:0,dy:-12,a:'middle'},{n:'부산 영도 도날드',lo:129.06,la:35.09,c:'#1F3864',r:5,dx:-10,dy:-10,a:'end'}];
nat.forEach(d=>{const [x,y]=P(d.lo,d.la);el(kr,'circle',{cx:x,cy:y,r:d.r,fill:d.c,stroke:'#fff','stroke-width':1.8});
 const t=el(kr,'text',{x:x+d.dx,y:y+d.dy,'font-size':13,'font-weight':700,fill:'#222','text-anchor':d.a||'start',stroke:'#F7F9FC','stroke-width':3,'paint-order':'stroke'},d.n)});
// 서울 (실제 축척)
const se=document.getElementById('se');const Q=mk(126.85,127.20,37.44,37.70,394,346,6,26,6);
HAN.forEach(l=>el(se,'polyline',{points:l.map(c=>Q(c[0],c[1]).map(v=>v.toFixed(1)).join(',')).join(' '),fill:'none',stroke:'#B9C7DC','stroke-width':9,'stroke-linecap':'round','stroke-linejoin':'round'}));
const [hx,hy]=Q(126.905,37.548);el(se,'text',{x:hx,y:hy+16,'font-size':12,fill:'#6B6B6B'},'한강');
const sp=[{n:'마복림할머니',sub:'중구 신당동',lo:127.017,la:37.564,red:1,dx:11,dy:5},{n:'도레미분식',sub:'도봉구 쌍문동',lo:127.032,la:37.650,dx:11,dy:5},{n:'먹쉬돈나',sub:'종로구 삼청동',lo:126.982,la:37.583,dx:-11,dy:-4,a:'end'},{n:'애플하우스',sub:'동작구 이수역',lo:126.982,la:37.486,dx:-11,dy:5,a:'end'},{n:'작은공간',sub:'강남구 도곡동',lo:127.045,la:37.489,dx:2,dy:24,a:'middle'},{n:'모꼬지에',sub:'송파구 잠실',lo:127.101,la:37.503,dx:11,dy:5}];
sp.forEach(d=>{const [x,y]=Q(d.lo,d.la);el(se,'circle',{cx:x,cy:y,r:6,fill:d.red?'#C00000':'#1F3864',stroke:'#fff','stroke-width':2});
 const o={'text-anchor':d.a||'start',stroke:'#F7F9FC','stroke-width':3,'paint-order':'stroke'};
 el(se,'text',Object.assign({x:x+d.dx,y:y+d.dy,'font-size':14,'font-weight':700,fill:'#222'},o),d.n);
 el(se,'text',Object.assign({x:x+d.dx,y:y+d.dy+15,'font-size':11.5,fill:'#6B6B6B'},o),d.sub)});
// 축척 막대 5km
const [sx0,sy0]=Q(127.12,37.452);const [sx1]=Q(127.12+5/(111.32*Math.cos(37.57*Math.PI/180)),37.452);
el(se,'line',{x1:sx0,y1:sy0,x2:sx1,y2:sy0,stroke:'#6B6B6B','stroke-width':2});el(se,'text',{x:(sx0+sx1)/2,y:sy0-5,'font-size':11,fill:'#6B6B6B','text-anchor':'middle'},'5 km');
</script></body></html>
