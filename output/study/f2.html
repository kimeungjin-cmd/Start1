<html><head><meta charset="utf-8"><style>:root{--main:#1F3864;--tint:#EEF2F8;--light:#DCE3EE;--mid:#8EA3C4;--red:#C00000;--redt:#FBE9E9;--gray:#6B6B6B;--dark:#222}
body{margin:0;word-break:keep-all;overflow-wrap:anywhere;font-family:'Malgun Gothic','Noto Sans CJK KR','Noto Sans KR',sans-serif; color:var(--dark)}
#figure{box-sizing:border-box;background:#fff}
#figure{padding:10px 18px;display:flex;flex-direction:column;justify-content:center}
.lbl{display:grid;grid-template-columns:30fr 25fr 30fr 15fr;font-size:15px;font-weight:bold;text-align:center;margin-bottom:6px}
.bar{display:grid;grid-template-columns:30fr 25fr 30fr 15fr;height:46px;border-radius:6px;overflow:hidden}
.bar div{display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:bold;color:#fff}
.z1{background:#C9CED6;color:var(--dark)!important}.z2{background:var(--mid)}.z3{background:var(--main)}.z4{background:#555}
.axis{display:grid;grid-template-columns:30fr 25fr 30fr 15fr;font-size:13.5px;color:var(--gray);margin-top:3px}
.axis span{border-left:1px solid #bbb;padding-left:3px}
.marks{position:relative;height:150px;margin-top:6px}
.m{position:absolute;top:0;transform:translateX(-50%);text-align:center;width:46%}
.m .tri{font-size:20px;line-height:20px}
.m .box{border-radius:8px;padding:8px 10px;font-size:15px;margin-top:2px}
.m1{left:31%}.m1 .tri{color:var(--red)}.m1 .box{background:var(--redt);border:2px solid var(--red)}
.m2{left:76%;width:44%}.m2 .tri{color:#555}.m2 .box{background:#F2F2F2;border:2px solid #888}
.m b{display:block;font-size:16px;margin-bottom:2px}
</style></head><body><div id="figure">
<div class="lbl"><span>모름</span><span>후보 2~3개</span><span style="color:var(--main)">유력</span><span>확인됨</span></div>
<div class="bar"><div class="z1">~40%</div><div class="z2">40~60%</div><div class="z3">60~85%</div><div class="z4">85%~</div></div>
<div class="axis"><span>0</span><span>40</span><span>60</span><span>85 &nbsp; 100%</span></div>
<div class="marks">
 <div class="m m1" style="left:68%"><div class="tri">▲</div><div class="box"><b style="color:var(--red)">판단 보고는 여기서 말함</b>약 70% — 확신도와<br>확정 날짜를 붙여서</div></div>
 <div class="m m2" style="left:79%;top:92px;width:40%"></div>
</div>
<div style="font-size:14.5px;color:var(--gray);text-align:right;margin-top:-34px">불량 판정(사실 보고)만 오른쪽 끝까지 기다림 ▶</div>
</div></body></html>
