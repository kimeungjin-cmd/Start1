<html><head><meta charset="utf-8"><style>:root{--main:#1F3864;--tint:#EEF2F8;--light:#DCE3EE;--mid:#8EA3C4;--red:#C00000;--redt:#FBE9E9;--gray:#6B6B6B;--dark:#222}
body{margin:0;word-break:keep-all;overflow-wrap:anywhere;font-family:'Malgun Gothic','Noto Sans CJK KR','Noto Sans KR',sans-serif; color:var(--dark)}
#figure{box-sizing:border-box;background:#fff}
#figure{display:grid;grid-template-columns:70px 1fr;grid-template-rows:auto 22px auto 22px auto;column-gap:10px;padding:8px 4px;align-items:center}
.side{font-size:14px;font-weight:bold;color:var(--gray);text-align:right}
.top{background:var(--main);color:#fff;border-radius:8px;padding:12px;text-align:center;font-size:17px;font-weight:bold;margin:0 50px}
.mid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mid div{background:var(--tint);border-radius:8px;padding:9px 6px;text-align:center;font-size:14.5px;font-weight:bold;color:var(--main);min-height:44px;display:flex;align-items:center;justify-content:center}
.bot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bot div{border:1.5px dashed var(--mid);border-radius:6px;padding:7px 4px;text-align:center;font-size:13.5px;color:var(--gray)}
.ar{grid-column:2;text-align:center;color:var(--mid);font-size:15px;line-height:22px}
</style></head><body><div id="figure">
<div class="side">결론<br>1문장</div><div class="top">접점 용량 부족이 유력(70%),<br>대체 부품 검토 착수 요청</div>
<div></div><div class="ar">▲ 왜 그렇게 판단했나 ▲</div>
<div class="side">근거<br>3개 이하</div><div class="mid"><div>12건 중 7건<br>같은 손상 패턴</div><div>제조불량은<br>X-ray로 배제</div><div>11/20 재현시험<br>으로 확정 예정</div></div>
<div></div><div class="ar">▲ 묶어서 한 줄씩 ▲</div>
<div class="side">데이터</div><div class="bot"><div>회수품 분석표</div><div>X-ray 사진</div><div>재현시험 계획</div></div>
</div></body></html>
