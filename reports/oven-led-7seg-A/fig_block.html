<!doctype html><html><head><meta charset="utf-8"><style>
:root{--main:#1F3864;--tint:#EEF2F8;--light:#DCE3EE;--mid:#8EA3C4;--red:#C00000;--gray:#6B6B6B;--dark:#222222;--line:#595959}
body{margin:0;font-family:"Malgun Gothic","맑은 고딕","Noto Sans CJK KR",sans-serif;word-break:keep-all}
#figure{width:541px;height:341px}
svg text{font-size:14.7px;fill:var(--dark)}
.t{font-weight:bold;fill:var(--main)} .r{fill:var(--red);font-weight:bold} .g{fill:var(--gray);font-size:13.3px}
</style></head><body><div id="figure"><svg width="541" height="341" viewBox="0 0 541 341">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#C00000"/></marker>
<marker id="am" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#1F3864"/></marker></defs>
<!-- main pcb -->
<rect x="8" y="95" width="150" height="150" rx="6" fill="#fff" stroke="#595959" stroke-width="1.5"/>
<text x="83" y="117" text-anchor="middle" class="t">메인 PCB</text>
<rect x="20" y="128" width="126" height="30" rx="4" fill="#EEF2F8" stroke="#8EA3C4"/><text x="83" y="148" text-anchor="middle">MCU</text>
<rect x="20" y="166" width="126" height="30" rx="4" fill="#EEF2F8" stroke="#8EA3C4"/><text x="83" y="186" text-anchor="middle">전원(SMPS)</text>
<rect x="20" y="204" width="126" height="30" rx="4" fill="#FBE9E9" stroke="#C00000"/><text x="83" y="224" text-anchor="middle">히터 릴레이·모터</text>
<!-- harness -->
<rect x="172" y="128" width="182" height="84" rx="8" fill="#EEF2F8" stroke="none"/>
<line x1="146" y1="143" x2="380" y2="143" stroke="#1F3864" stroke-width="2.5" marker-end="url(#am)"/>
<text x="263" y="165" text-anchor="middle" class="g">CLK·DIO·STB</text>
<line x1="146" y1="181" x2="380" y2="181" stroke="#1F3864" stroke-width="2.5" stroke-dasharray="0"/>
<text x="263" y="203" text-anchor="middle" class="g">VDD·GND</text>
<text x="273" y="232" class="g">하네스(FFC)</text>
<!-- display pcb -->
<rect x="368" y="95" width="165" height="150" rx="6" fill="#fff" stroke="#595959" stroke-width="1.5"/>
<text x="450" y="117" text-anchor="middle" class="t">디스플레이 PCB</text>
<rect x="380" y="128" width="141" height="62" rx="4" fill="#EEF2F8" stroke="#8EA3C4"/><text x="450" y="164" text-anchor="middle">드라이버 IC</text>
<line x1="450" y1="190" x2="450" y2="202" stroke="#1F3864" stroke-width="2" marker-end="url(#am)"/>
<rect x="380" y="204" width="141" height="30" rx="4" fill="#EEF2F8" stroke="#8EA3C4"/><text x="450" y="224" text-anchor="middle">7세그 LED</text>
<!-- noise labels -->
<text x="263" y="40" text-anchor="middle"><tspan class="r">A</tspan> 개폐 노이즈 유도</text>
<line x1="263" y1="50" x2="263" y2="126" stroke="#C00000" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="450" y="40" text-anchor="middle"><tspan class="r">C</tspan> 구동 타이밍(고스트)</text>
<line x1="450" y1="50" x2="450" y2="93" stroke="#C00000" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="83" y="270" text-anchor="middle" class="g">↑ 주요 노이즈원</text>
<line x1="263" y1="300" x2="263" y2="214" stroke="#C00000" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="263" y="325" text-anchor="middle"><tspan class="r">B</tspan> 전원 강하·정전기</text>
<line x1="450" y1="300" x2="450" y2="247" stroke="#C00000" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="450" y="325" text-anchor="middle"><tspan class="r">D</tspan> 고온·습기·접촉</text>
</svg></div></body></html>
